# Compile le lanceur et les add-ons de cleanyourtv (version épinglée dans cleanyourtv.commit) et
# publie les APK comme artefacts du run : onglet Actions → dernier run → Artifacts → lanceur-apk
# et addons-apk.
name: Compiler l'APK du lanceur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version de cleanyourtv à compiler
        id: amont
        run: echo "commit=$(tr -d '[:space:]' < cleanyourtv.commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Gathin23/cleanyourtv
          ref: ${{ steps.amont.outputs.commit }}
          path: cleanyourtv
          persist-credentials: false
      # Mêmes versions que le CI de cleanyourtv : JDK 17, plateforme et build-tools Android 34.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # Toujours la même clé (signature/debug.keystore) : une nouvelle version s'installe par-dessus l'ancienne.
      - name: Clé de signature fixe
        run: mkdir -p ~/.android && cp signature/debug.keystore ~/.android/debug.keystore
      - name: Patchs vTV du lanceur (lanceur/patchs)
        run: for p in lanceur/patchs/*.patch; do echo "$p"; git -C cleanyourtv apply "../$p"; done
      - name: Tests unitaires et build release
        working-directory: cleanyourtv/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Empreinte de l'APK
        run: sha256sum cleanyourtv/launcher/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lanceur-apk
          path: cleanyourtv/launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Les add-ons de cleanyourtv, à la même version. Chacun dans son job : un add-on qui casse
  # n'empêche pas les autres d'être compilés.
  addon:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: tv-hub, paquet: io.github.maxhayim.tvhub, tache: assembleDebug, sortie: debug/app-debug.apk }
          - { nom: sleep-timer, paquet: io.github.luyzfernando08.sleeptimer, tache: assembleRelease, sortie: release/app-release.apk }
          - { nom: weather, paquet: io.github.sumyabazar1.weather, tache: assembleRelease, sortie: release/app-release.apk }
          - { nom: world-clock, paquet: io.github.savioronezero.worldclock, tache: assembleRelease, sortie: release/app-release.apk }
          - { nom: photo-screensaver, paquet: com.gathin.photodream, tache: assembleRelease, sortie: release/app-release.apk }
          - { nom: photo-prints, paquet: io.github.shivamsingh262.photoprints, tache: assembleRelease, sortie: release/app-release.apk }
          - { nom: news-screensaver, paquet: com.gathin.newsdream, tache: assembleRelease, sortie: release/app-release.apk }
          - { nom: digital-rain, paquet: io.github.dennisoleary.digitalrain, tache: assembleRelease, sortie: release/app-release.apk }
          - { nom: startup-branding, paquet: io.github.maxhayim.startupbranding, tache: assembleRelease, sortie: release/app-release.apk }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version de cleanyourtv à compiler
        id: amont
        run: echo "commit=$(tr -d '[:space:]' < cleanyourtv.commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Gathin23/cleanyourtv
          ref: ${{ steps.amont.outputs.commit }}
          path: cleanyourtv
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # Toujours la même clé (signature/debug.keystore) : une nouvelle version s'installe par-dessus l'ancienne.
      - name: Clé de signature fixe
        run: mkdir -p ~/.android && cp signature/debug.keystore ~/.android/debug.keystore
      - name: Build ${{ matrix.nom }}
        working-directory: cleanyourtv/addons/${{ matrix.nom }}
        run: |
          # Certains add-ons appellent le gradlew du lanceur depuis le leur.
          chmod +x gradlew ../../launcher/gradlew
          ./gradlew --no-daemon ${{ matrix.tache }}
          mkdir -p "$GITHUB_WORKSPACE/sortie"
          # Nommé d'après son paquet : installer-addons.ps1 sait ainsi quoi remplacer.
          cp "app/build/outputs/apk/${{ matrix.sortie }}" "$GITHUB_WORKSPACE/sortie/${{ matrix.paquet }}.apk"
          sha256sum "$GITHUB_WORKSPACE/sortie/${{ matrix.paquet }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.nom }}
          path: sortie/${{ matrix.paquet }}.apk
          if-no-files-found: error

  # Les raccourcis vers les sites (raccourcis/) : une appli par entrée de raccourcis/sites.json.
  sites:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.lire.outputs.liste }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: lire
        run: echo "liste=$(jq -c . raccourcis/sites.json)" >> "$GITHUB_OUTPUT"

  raccourci:
    needs: sites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.liste) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version de cleanyourtv (pour son Gradle)
        id: amont
        run: echo "commit=$(tr -d '[:space:]' < cleanyourtv.commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Gathin23/cleanyourtv
          ref: ${{ steps.amont.outputs.commit }}
          path: cleanyourtv
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # Toujours la même clé (signature/debug.keystore) : une nouvelle version s'installe par-dessus l'ancienne.
      - name: Clé de signature fixe
        run: mkdir -p ~/.android && cp signature/debug.keystore ~/.android/debug.keystore
      - name: Build site-${{ matrix.site.id }}
        env:
          SITE_ID: ${{ matrix.site.id }}
          SITE_NOM: ${{ matrix.site.nom }}
          SITE_URL: ${{ matrix.site.url }}
        run: |
          chmod +x cleanyourtv/launcher/gradlew
          cleanyourtv/launcher/gradlew --no-daemon -p raccourcis assembleRelease \
            "-PsiteId=$SITE_ID" "-PsiteNom=$SITE_NOM" "-PsiteUrl=$SITE_URL"
          mkdir -p sortie
          cp raccourcis/app/build/outputs/apk/release/app-release.apk "sortie/io.github.vnoxxy.vtv.site.$SITE_ID.apk"
          sha256sum "sortie/io.github.vnoxxy.vtv.site.$SITE_ID.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: addon-site-${{ matrix.site.id }}
          path: sortie/io.github.vnoxxy.vtv.site.${{ matrix.site.id }}.apk
          if-no-files-found: error

  # Un seul zip à télécharger : Artifacts → addons-apk (add-ons et raccourcis).
  addons-apk:
    needs: [addon, raccourci]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          path: addons-apk
          merge-multiple: true
      - run: ls -l addons-apk
      - uses: actions/upload-artifact@v4
        with:
          name: addons-apk
          path: addons-apk/*.apk
          if-no-files-found: error
