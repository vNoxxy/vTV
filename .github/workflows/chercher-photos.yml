# Cherche des photos libres pour les fonds par appli (outils/chercher_photos.py) et les pousse,
# miniatures et crédits, sur la branche photos-candidats, pour les choisir.
name: Chercher des photos

on:
  workflow_dispatch:
    inputs:
      recherches:
        description: "Recherches séparées par des ;"
        required: true

permissions:
  contents: write

jobs:
  chercher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Recherche sur Wikimedia Commons
        env:
          RECHERCHES: ${{ inputs.recherches }}
        run: |
          IFS=';' read -ra liste <<< "$RECHERCHES"
          python3 outils/chercher_photos.py candidats "${liste[@]}"
      - name: Pousser sur photos-candidats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan photos-candidats
          git rm -rfq --cached .
          git add candidats
          git commit -qm "Photos candidates : $(date -u +%F)"
          git push -f origin photos-candidats
